version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: phoebe-postgres
    environment:
      POSTGRES_USER: phoebe
      POSTGRES_PASSWORD: phoebe_password
      POSTGRES_DB: phoebe_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
